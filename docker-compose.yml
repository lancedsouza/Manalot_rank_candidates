version: '3.8'

services:
  # 1. The FastAPI Backend
  api:
    build: .
    container_name: ats_api
    command: uvicorn backend_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app  # Live code reloading

  # 2. The Celery AI Worker
  worker:
    build: .
    container_name: ats_worker
    command: celery -A worker worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - api

  # 3. The Streamlit Frontend
  frontend:
    build: .
    container_name: ats_frontend
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - api